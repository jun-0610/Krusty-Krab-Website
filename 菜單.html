  <script>
    function showSelections() {
      const selectedItems = document.querySelectorAll('input[name="menu-item"]:checked');
      let totalPrice = 0;
      const selectedList = Array.from(selectedItems).map(item => {
        const price = parseInt(item.dataset.price, 10);
        totalPrice += price;
        return `${item.value} - $${price}`;
      });
      const output = document.getElementById('selected-items');
      if (selectedList.length > 0) {
        output.innerHTML = `<h3>餐點明細：</h3><ul>${selectedList.map(item => `<li>${item}</li>`).join('')}</ul><h3>總金額：$${totalPrice}  所有餐點接為現做，請耐心等候，謝謝</h3>`;
      } else {
        output.innerHTML = '<h3>您尚未選擇餐點</h3>';
      }
    }
  </script>
